name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The browser test needs a real Chromium; the runner has none installed.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
